# Runs smoke-tagged Maestro flows on an iOS simulator build.
# Triggered by adding the `e2e` label to a PR, to keep EAS usage (and cost) predictable.
# Requires an EAS plan that includes Maestro jobs. Set MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD
# as EAS environment variables (secret visibility) for the seeded test account.
name: E2E iOS

on:
  pull_request_labeled:
    labels: [e2e]

jobs:
  build:
    name: Build iOS simulator (e2e-test)
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro:
    name: Maestro smoke flows
    type: maestro
    needs: [build]
    env:
      MAESTRO_APP_ID: com.example.expoapptemplate.preview
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: ./.maestro/flows
      include_tags: [smoke]
      retries: 1
      record_screen: true
