name: E2E

# A release-style Android build plus an emulator takes 20-30 minutes, so it does not run on every PR.
# Add the `e2e` label to a PR, or run it from the Actions tab. It also runs on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.github/copilot-instructions.md'
      - 'evals/**'
      - 'specs/**'
      - 'licenses/**'
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  # An unrelated label (not e2e) gets its own group so it cannot cancel a running e2e run; main pushes are never cancelled.
  group: e2e-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'e2e' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  android:
    # The label limits runner cost; it is NOT a security boundary (a fork PR runs its own copy of this file).
    # Safety comes from the job needing no secrets and a read-only token. Never add secrets here or switch to
    # pull_request_target; keep "Require approval for outside contributors" on in the repo's Actions settings.
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      # e2e needs Node ^22.22.3 or >=24.8.0 at runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app.config.ts', 'bun.lock', 'package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # Release-style: the JS bundle is embedded, so there is no dev launcher and no Metro. A debug build
      # cannot run in CI because nothing serves its JS. The release type signs with the debug keystore, so no secrets.
      - name: Build release APK
        # A failed or out-of-memory Gradle daemon can hang instead of exiting: fail the step, not the whole job.
        timeout-minutes: 40
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000
          APP_ENV: development
          EXPO_PUBLIC_APP_ENV: development
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          bunx expo prebuild --platform android --no-install
          # The default daemon (2 GB heap, 512 MB metaspace) ran out of metaspace in the release lint pass.
          # Lint is not needed for an e2e APK, so skip it and give the daemon more headroom.
          cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 \
            -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Install and test share one step: the action tears the emulator down when the step ends.
      # The second run retries only what failed, which absorbs a flaky emulator daemon on a shared runner.
      - name: Run e2e on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_BUILD: release
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            bunx --no-install e2e run --target android --reporter list,junit,markdown || bunx --no-install e2e run --target android --last-failed --reporter list,junit,markdown

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-android
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/failures
            .e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
