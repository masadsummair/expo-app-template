# Submitting an empty form shows field errors and stays on sign-in.
appId: ${MAESTRO_APP_ID}
tags:
  - smoke
onFlowStart:
  - runFlow: ../shared/_on-flow-start.yaml
---
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 15000
- tapOn:
    id: sign-in-submit
- assertVisible:
    id: sign-in-email-error
- assertVisible:
    id: sign-in-password-error
- assertNotVisible:
    id: home-screen
