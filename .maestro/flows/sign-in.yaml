# Signs in, lands on home, signs out, and returns to sign-in.
appId: ${MAESTRO_APP_ID}
tags:
  - smoke
onFlowStart:
  - runFlow: ../shared/_on-flow-start.yaml
---
- runFlow: ../shared/_sign-in.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- tapOn:
    id: home-sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 10000
