# Signs in with the seeded test account passed as MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD
# (maestro test -e MAESTRO_TEST_EMAIL=... locally; job env in EAS — only MAESTRO_* vars reach flows there).
# Never hardcode real credentials.
appId: ${MAESTRO_APP_ID}
---
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 15000
- tapOn:
    id: sign-in-email
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
